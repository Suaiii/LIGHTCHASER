<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filterous 2 Smoke Test</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    color: #f7f4ee;
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #08090d;
  }
  h1 { margin: 0 0 14px; font-size: 22px; }
  #status { margin-bottom: 16px; color: rgba(247,244,238,.7); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  figure {
    margin: 0;
    border: 1px solid rgba(255,255,255,.14);
    background: #151821;
    padding: 10px;
  }
  img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #000;
  }
  figcaption {
    margin-top: 8px;
    color: rgba(247,244,238,.72);
    font-size: 12px;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <h1>Filterous 2 Smoke Test</h1>
  <div id="status">正在生成滤镜对照图...</div>
  <section class="grid" id="grid"></section>

  <script src="./vendor/filterous2.min.js"></script>
  <script>
    const smokeFilters = [
      ["original", "原图"],
      ["clarendon", "Google Dynamic / iPhone Rich Contrast"],
      ["juno", "iPhone Vibrant"],
      ["inkwell", "FUJIFILM ACROS"],
      ["valencia", "iPhone Warm"],
    ];
    const sourceUrl = "./assets/jingansi/cover.png";
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");

    function makeFigure(name, label) {
      const figure = document.createElement("figure");
      const image = document.createElement("img");
      const caption = document.createElement("figcaption");
      caption.textContent = `${label} (${name})`;
      figure.append(image, caption);
      grid.appendChild(figure);
      return { image, caption };
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = url;
      });
    }

    function renderFilter(sourceImage, filterName, targetImage) {
      return new Promise((resolve, reject) => {
        const sourceCanvas = imageToFilterousCanvas(sourceImage);
        targetImage.onload = resolve;
        targetImage.onerror = reject;
        try {
          filterous.importImage(sourceCanvas)
            .applyInstaFilter(filterName)
            .renderHtml(targetImage);
        } catch (error) {
          reject(error);
        }
      });
    }

    function imageToFilterousCanvas(image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      canvas.getContext("2d").drawImage(image, 0, 0);
      Object.defineProperty(canvas, "naturalWidth", { configurable: true, value: canvas.width });
      Object.defineProperty(canvas, "naturalHeight", { configurable: true, value: canvas.height });
      return canvas;
    }

    function imageDifference(baseImage, filteredImage) {
      const width = 160;
      const height = 120;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(baseImage, 0, 0, width, height);
      const base = ctx.getImageData(0, 0, width, height).data;
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(filteredImage, 0, 0, width, height);
      const filtered = ctx.getImageData(0, 0, width, height).data;
      let total = 0;
      for (let index = 0; index < base.length; index += 4) {
        total += Math.abs(base[index] - filtered[index]);
        total += Math.abs(base[index + 1] - filtered[index + 1]);
        total += Math.abs(base[index + 2] - filtered[index + 2]);
      }
      return Math.round(total / (width * height * 3));
    }

    async function main() {
      if (!window.filterous?.importImage) {
        throw new Error("filterous-2 未加载");
      }
      const sourceImage = await loadImage(sourceUrl);
      const original = makeFigure("original", "原图");
      original.image.src = sourceUrl;
      await loadImage(sourceUrl);

      const diffs = [];
      for (const [filterName, label] of smokeFilters.slice(1)) {
        const item = makeFigure(filterName, label);
        await renderFilter(sourceImage, filterName, item.image);
        const diff = imageDifference(original.image, item.image);
        diffs.push(diff);
        item.caption.textContent = `${label} (${filterName}) - 平均像素差 ${diff}`;
      }
      statusEl.textContent = `filterous-2 已加载，${diffs.length} 个滤镜生成完成，平均像素差：${diffs.join(" / ")}`;
      document.body.dataset.filterousSmoke = "ok";
      document.body.dataset.filterousDiffs = diffs.join(",");
    }

    main().catch((error) => {
      statusEl.textContent = `filterous-2 验证失败：${error.message}`;
      document.body.dataset.filterousSmoke = "failed";
    });
  </script>
</body>
</html>
