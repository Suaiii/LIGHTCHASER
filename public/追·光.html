<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>追·光 · 光报</title>

<link rel="preconnect" href="https://fonts.font.im">
<link href="https://fonts.font.im/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./vendor/leaflet.css">

<style>
  :root {
    /* 晚霞色卡 — 项目核心 */
    --sky-grayblue: #3a4a6b;
    --sky-amber:    #e0a060;
    --sky-crimson:  #c84858;
    --sky-violet:   #5a3870;
    --sky-pre-dawn: #1a1d2e;
    --sky-after:    #14172a;

    /* 应用色板 */
    --bg:        oklch(0.16 0.02 270);
    --bg-card:   oklch(0.22 0.022 268);
    --bg-card-2: oklch(0.27 0.024 268);
    --ink:       oklch(0.97 0.008 80);
    --ink-dim:   oklch(0.68 0.012 80);
    --ink-mute:  oklch(0.46 0.015 268);
    --line:      oklch(0.32 0.018 268);
    --accent:    #ff8a3d;     /* 追光橘 */
    --accent-2:  #ffd49a;
    --pos:       #4ad97a;
    --warn:      #ff5b5b;

    --font-cn: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "Fraunces", "Noto Serif SC", serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0d;
    color: var(--ink);
    font-family: var(--font-cn);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    min-height: 100dvh;
  }

  #app {
    display: grid;
    place-items: center;
    width: 100vw;
    height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(200,72,88,0.10), transparent 60%),
      radial-gradient(1000px 500px at 90% 100%, rgba(90,56,112,0.16), transparent 60%),
      #0a0a0d;
  }

  /* 隐藏滚动条 */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* 一些通用工具 */
  .num { font-family: var(--font-display); font-feature-settings: "tnum"; letter-spacing: -0.01em; }
  .mono { font-family: var(--font-mono); }
  .hairline { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }

  [data-feed-card] .float-pop {
    opacity: 0;
    transform: translate3d(0, 42px, 0) scale(0.92);
    filter: blur(3px) saturate(0.72);
    will-change: transform, opacity, filter;
  }

  [data-feed-card="active"] .float-pop {
    animation: floatPop 560ms cubic-bezier(.16,.9,.18,1.18) forwards;
    animation-delay: var(--float-delay, 0ms);
  }

  @keyframes floatPop {
    0% {
      opacity: 0;
      transform: translate3d(0, 42px, 0) scale(0.92);
      filter: blur(3px) saturate(0.72);
    }
    64% {
      opacity: 1;
      transform: translate3d(0, -10px, 0) scale(1.045);
      filter: blur(0) saturate(1.12);
    }
    100% {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0) saturate(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-feed-card] .float-pop {
      opacity: 1;
      transform: none;
      filter: none;
      animation: none !important;
    }
  }
</style>

<!-- Speaker notes — none -->
</head>
<body>
  <div id="app"></div>

  <!-- React + Babel + Leaflet + Three (local vendor, no CDN) -->
  <script src="./vendor/react.development.js"></script>
  <script src="./vendor/react-dom.development.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script src="./vendor/leaflet.js"></script>
  <script src="./vendor/three.min.js"></script>
  <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
  <script src="./vendor/maplibre-gl.js"></script>
  <script src="./vendor/suncalc.js"></script><!-- 光照时刻控制：真实太阳轨迹推算（与 sun_events 同源几何） -->
  <!-- AI 相机能力（队友系统）：滤镜引擎 + 场景识别，P4 快拍嵌入用 -->
  <script src="./vendor/filterous2.min.js"></script>
  <script src="./vision-engine.js"></script>
  <script src="./ai-camera-core.browser.js"></script>
  <script src="./ai-camera-luts.js"></script>
  <script src="./ai-camera-filter-layers.js"></script>
  <script src="./lightchaser-camera-session.js"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="scenes.jsx"></script>
  <script type="text/babel" src="subpanels.jsx"></script>
  <script type="text/babel" src="light-map-3d.jsx"></script>
  <script type="text/babel" src="light-map-gl.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
