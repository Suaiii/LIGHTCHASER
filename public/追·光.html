<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>追·光 · 光报</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  :root {
    /* 晚霞色卡 — 项目核心 */
    --sky-grayblue: #3a4a6b;
    --sky-amber:    #e0a060;
    --sky-crimson:  #c84858;
    --sky-violet:   #5a3870;
    --sky-pre-dawn: #1a1d2e;
    --sky-after:    #14172a;

    /* 应用色板 */
    --bg:        oklch(0.16 0.02 270);
    --bg-card:   oklch(0.22 0.022 268);
    --bg-card-2: oklch(0.27 0.024 268);
    --ink:       oklch(0.97 0.008 80);
    --ink-dim:   oklch(0.68 0.012 80);
    --ink-mute:  oklch(0.46 0.015 268);
    --line:      oklch(0.32 0.018 268);
    --accent:    #ff8a3d;     /* 追光橘 */
    --accent-2:  #ffd49a;
    --pos:       #4ad97a;
    --warn:      #ff5b5b;

    --font-cn: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "Fraunces", "Noto Serif SC", serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0d;
    color: var(--ink);
    font-family: var(--font-cn);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    min-height: 100dvh;
  }

  #app {
    display: grid;
    place-items: center;
    width: 100vw;
    height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(200,72,88,0.10), transparent 60%),
      radial-gradient(1000px 500px at 90% 100%, rgba(90,56,112,0.16), transparent 60%),
      #0a0a0d;
  }

  /* 隐藏滚动条 */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* 一些通用工具 */
  .num { font-family: var(--font-display); font-feature-settings: "tnum"; letter-spacing: -0.01em; }
  .mono { font-family: var(--font-mono); }
  .hairline { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
</style>

<!-- Speaker notes — none -->
</head>
<body>
  <div id="app"></div>

  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="scenes.jsx"></script>
  <script type="text/babel" src="subpanels.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
